<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Analytics 4 (gtag.js). send_page_view is off: this is an SPA, so page_view
         events are fired manually on each route change from src/utils/analytics.js. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ELDFY712G6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ELDFY712G6', { send_page_view: false });
    </script>

    <title>Poiesis Studio — Architecture & Interior Design</title>
    <meta name="description" content="Poiesis Studio is a Jakarta-based Architecture & Interior Design consultancy. Design Through Stories." />
    <link rel="canonical" href="https://poiesis.id/" />

    <!-- Social share / Open Graph. NOTE: these are the site-wide defaults served in the
         static HTML — social scrapers (WhatsApp, Facebook, LinkedIn) do not run JS, so every
         shared URL shows this homepage preview until per-page prerendering is added. The Vue
         SEO helper (src/utils/seo.js) updates these per-route for JS-rendering crawlers (Google)
         and the browser tab. -->
    <meta property="og:site_name" content="Poiesis Studio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Poiesis Studio — Architecture & Interior Design" />
    <meta property="og:description" content="A Jakarta-based Architecture & Interior Design consultancy. Design Through Stories." />
    <meta property="og:url" content="https://poiesis.id/" />
    <meta property="og:image" content="https://poiesis.id/images/projects/bangka-1210/02.jpg" />
    <meta property="og:locale" content="en_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Poiesis Studio — Architecture & Interior Design" />
    <meta name="twitter:description" content="A Jakarta-based Architecture & Interior Design consultancy. Design Through Stories." />
    <meta name="twitter:image" content="https://poiesis.id/images/projects/bangka-1210/02.jpg" />

    <!-- Structured data: helps Google understand Poiesis as a real, locatable practice. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Poiesis Studio",
      "alternateName": "Poiesis",
      "legalName": "PT. Pencipta Organik Imaji",
      "description": "Jakarta-based Architecture & Interior Design consultancy. Design Through Stories.",
      "url": "https://poiesis.id/",
      "logo": "https://poiesis.id/images/brand/poiesis-logo.png",
      "image": "https://poiesis.id/images/projects/bangka-1210/02.jpg",
      "telephone": "+62-812-1832-1775",
      "email": "enquiry@poiesis.id",
      "priceRange": "$$$",
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "09:00",
        "closes": "18:00"
      },
      "areaServed": [
        { "@type": "City", "name": "Jakarta" },
        { "@type": "City", "name": "Tangerang Selatan" },
        { "@type": "Country", "name": "Indonesia" }
      ],
      "founder": {
        "@type": "Person",
        "name": "Amita Ratih Purnamasari",
        "jobTitle": "Principal Architect"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Calamus C7-35, Citra Garden Bintaro",
        "addressLocality": "Ciputat, Tangerang Selatan",
        "addressRegion": "Banten",
        "postalCode": "15413",
        "addressCountry": "ID"
      },
      "sameAs": [
        "https://instagram.com/poiesis.id"
      ]
    }
    </script>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon-180x180.png" sizes="180x180" />
    <!-- Fonts are self-hosted (see src/assets/fonts.css) — no third-party font requests.
         Preload the two latin weights on the critical path: body (200) + UI/labels (500). -->
    <link rel="preload" href="/fonts/hanken-grotesk-200-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/hanken-grotesk-500-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
